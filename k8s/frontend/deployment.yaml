apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-website-frontend
  namespace: personal-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: personal-website-frontend
  template:
    metadata:
      labels:
        app: personal-website-frontend
    spec:
      containers:
      - name: frontend
        image: personal-website-frontend
        ports:
        - containerPort: 3000
        env:
        - name: API_INTERNAL_URL
          value: "http://personal-website-api:8000"
        # Checks the API's calls to /api/revalidate (docs/design.md section 13).
        - name: REVALIDATE_SECRET
          valueFrom:
            secretKeyRef:
              name: personal-website-api-secrets
              key: REVALIDATE_SECRET
