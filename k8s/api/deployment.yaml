apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-website-api
  namespace: personal-website
spec:
  replicas: 1
  # SQLite has one writer and the volume is ReadWriteOnce: stop the old pod before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: personal-website-api
  template:
    metadata:
      labels:
        app: personal-website-api
    spec:
      containers:
      - name: api
        image: personal-website-api
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: personal-website-api-config
        - secretRef:
            name: personal-website-api-secrets
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: personal-website-api-data
