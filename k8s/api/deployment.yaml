apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-website-api
  namespace: personal-website
spec:
  replicas: 1
  selector:
    matchLabels:
      app: personal-website-api
  template:
    metadata:
      labels:
        app: personal-website-api
    spec:
      containers:
      - name: api
        image: personal-website-api
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: personal-website-api-config
