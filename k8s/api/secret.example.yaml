# Template only: never commit real values. Tilt builds the dev Secret itself (Tiltfile); production creates it on
# the home server, for example:
#   kubectl -n personal-website create secret generic personal-website-api-secrets \
#     --from-literal=ADMIN_AUTH_PASSWORD_HASH="$(make -s -C src/api hash-password)" \
#     --from-literal=REVALIDATE_SECRET="$(openssl rand -hex 32)"
# The frontend reads the same REVALIDATE_SECRET from this Secret to check the API's revalidation calls.
apiVersion: v1
kind: Secret
metadata:
  name: personal-website-api-secrets
  namespace: personal-website
type: Opaque
stringData:
  # An argon2 hash (`make -C src/api hash-password`). Leave empty to disable admin login.
  ADMIN_AUTH_PASSWORD_HASH: ""
  # Shared with the frontend's /api/revalidate route.
  REVALIDATE_SECRET: ""
