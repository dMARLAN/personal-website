---
name: Check PR

on:
  pull_request:
    branches: [master]
    types: ["opened", "synchronize"]

permissions:
  contents: read
  pull-requests: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Check for Changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            root:
              - "pyproject.toml"
              - "uv.lock"
              - "Makefile"
              - "scripts/**"
              - ".github/workflows/**"
            api:
              - "src/api/**"
            frontend:
              - "src/frontend/**"
              - "dockerfiles/**"
    outputs:
      rootChanged: ${{ steps.filter.outputs.root }}
      apiChanged: ${{ steps.filter.outputs.api }}
      frontendChanged: ${{ steps.filter.outputs.frontend }}

  api-ci:
    name: API CI
    runs-on: ubuntu-latest
    needs:
      - setup
    if: ${{ needs.setup.outputs.apiChanged == 'true' || needs.setup.outputs.rootChanged == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install UV
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true
      - name: Run make ci
        working-directory: ./src/api
        run: make ci

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    needs:
      - setup
    if: ${{ needs.setup.outputs.frontendChanged == 'true' || needs.setup.outputs.rootChanged == 'true' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: "src/frontend/.node-version"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json
      - name: Run make ci
        working-directory: ./src/frontend
        run: make ci

  check:
    name: Result
    runs-on: ubuntu-latest
    if: always()
    needs:
      - api-ci
      - frontend-ci
    steps:
      - name: Result
        uses: re-actors/alls-green@release/v1
        with:
          allowed-skips: api-ci, frontend-ci
          jobs: ${{ toJSON(needs) }}
