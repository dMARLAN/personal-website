[project]
name = "personal-website"
version = "0.1.0"
description = "Chad's personal website"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = ["src/api"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pyright]
include = ["src"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = [
    "A",   # built-in shadowing
    "ANN", # type annotations
    "ISC", # implicit/explicit string concatenation
    "RET", # returns
    "SIM", # simplify
    "ARG", # unused args
    "PTH", # use pathlib
    "C90", # high complexity
    "E",   # code style
    "F",   # pyflakes
    "PLE", # errors
    "PLR", # refactoring
    "UP",  # pyupgrade
    "UP042", # Use (StrEnum) instead of (str, Enum)
    "UP007", # Use X | Y instead of Union[X, Y]
    "UP045", # Use X | None instead of Optional[X]
]
ignore = [
    "RET501", # unnecessary-return-none
    "E501",   # line too long (handled by ruff format)
]
preview = true
fixable = ["E", "F401"]
unfixable = []
mccabe.max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Numpy bake tooling: augmented assignment would mutate shared arrays in place, and the shading maths is full of
# physical constants and wide signatures.
"scripts/materials/*" = ["PLR"]
